<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">How SwapBelt works</title>
  <desc id="desc">Five illustrated steps: insert the core, run with easy access, remove the core, clean and reset, and ready again.</desc>
  <defs>
    <style>
      .h{font:900 56px Inter,Arial,sans-serif;letter-spacing:3px;fill:#20242a}.n{font:400 36px Inter,Arial,sans-serif;fill:#20242a}.t{font:700 30px Inter,Arial,sans-serif;fill:#20242a}.p{font:400 26px Inter,Arial,sans-serif;fill:#4b515b}.line{fill:none;stroke:#20242a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.blue{fill:#9ec9e5}.soft{fill:#dcebf4}.belt{fill:#d7e5ef;stroke:#20242a;stroke-width:7}.dark{fill:#20242a}
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#fbfaf8"/>
  <text class="h" x="900" y="120" text-anchor="middle">HOW SWAPBELT WORKS</text>
  <g transform="translate(78 215)">
    <g transform="translate(0 0)">
      <circle class="soft" cx="120" cy="40" r="34"/><text class="n" x="120" y="53" text-anchor="middle">1</text>
      <text class="t" x="120" y="140" text-anchor="middle">Insert the Core</text>
      <path class="belt" d="M24 330c80-46 122-46 190 0 64 42 113 42 202 0v64c-72 40-138 42-202 0-65-44-120-44-190 0z"/>
      <path class="dark" d="M182 258h112v122H182z" opacity=".9"/><path class="line" d="M238 205v82"/><path fill="#6db8df" d="M238 330l-26-52h52z"/>
      <path class="line" d="M70 262c52 12 92 20 118 62M94 224c40 22 74 48 104 96"/>
      <text class="p" x="0" y="500">Slide the sweatproof</text><text class="p" x="0" y="540">core into the outer</text><text class="p" x="0" y="580">belt and secure your</text><text class="p" x="0" y="620">essentials.</text>
    </g>
    <g transform="translate(365 0)">
      <circle class="soft" cx="120" cy="40" r="34"/><text class="n" x="120" y="53" text-anchor="middle">2</text>
      <text class="t" x="120" y="140" text-anchor="middle">Run with</text><text class="t" x="120" y="180" text-anchor="middle">Easy Access</text>
      <circle class="line" cx="155" cy="272" r="44"/><path class="line" d="M125 314l-45 105 78 24 44-104 70 58"/><path class="line" d="M128 356l-88 92M198 336l86-66"/><rect class="dark" x="84" y="408" width="108" height="45" rx="16"/>
      <rect x="258" y="254" width="42" height="60" rx="8" fill="#fff" stroke="#20242a" stroke-width="7"/>
      <text class="p" x="0" y="500">Everything stays dry</text><text class="p" x="0" y="540">and right where you</text><text class="p" x="0" y="580">need it — with quick,</text><text class="p" x="0" y="620">top-opening access</text><text class="p" x="0" y="660">mid-run.</text>
    </g>
    <g transform="translate(730 0)">
      <circle class="soft" cx="120" cy="40" r="34"/><text class="n" x="120" y="53" text-anchor="middle">3</text>
      <text class="t" x="120" y="140" text-anchor="middle">Remove the Core</text>
      <path class="belt" d="M20 318c74-34 142-34 216 0 70 32 132 32 196 0v70c-70 34-140 34-210 0-62-30-128-30-202 0z"/>
      <rect x="155" y="266" width="155" height="115" rx="18" fill="#f4f4f2" stroke="#20242a" stroke-width="7"/>
      <path class="line" d="M80 230c28 42 66 68 116 76M220 202c8 48 18 84 56 108"/>
      <text class="p" x="0" y="500">After your run, simply</text><text class="p" x="0" y="540">take the core out of</text><text class="p" x="0" y="580">the belt.</text>
    </g>
    <g transform="translate(1095 0)">
      <circle class="soft" cx="120" cy="40" r="34"/><text class="n" x="120" y="53" text-anchor="middle">4</text>
      <text class="t" x="120" y="140" text-anchor="middle">Clean + Reset</text>
      <rect x="178" y="242" width="118" height="150" rx="16" fill="#fff" stroke="#20242a" stroke-width="7"/><circle class="soft" cx="237" cy="330" r="38"/><path class="line" d="M42 330c74 38 126 38 190 0"/><path class="belt" d="M45 398c80-30 137-30 212 0v48c-72 30-140 30-212 0z"/><path class="line" d="M92 286c46-34 96-36 150 0"/>
      <text class="p" x="0" y="500">• Toss the sweat-wicking</text><text class="p" x="24" y="540">belt in the laundry</text><text class="p" x="0" y="590">• Wipe clean the</text><text class="p" x="24" y="630">sweatproof core</text>
    </g>
    <g transform="translate(1460 0)">
      <circle class="soft" cx="120" cy="40" r="34"/><text class="n" x="120" y="53" text-anchor="middle">5</text>
      <text class="t" x="120" y="140" text-anchor="middle">Ready Again</text>
      <circle class="line" cx="152" cy="252" r="38"/><path class="line" d="M108 292c62 8 112 46 116 118M116 310l-76 112M210 400l-96 70M42 422c64 34 132 34 200 0"/><path class="dark" d="M68 392h180v42H68z"/>
      <text x="312" y="350" font="900 72px Inter,Arial" fill="#7fb8d5">∞</text>
      <text class="p" x="0" y="500">Fresh belt. Same core.</text><text class="p" x="0" y="540">Ready for your next run.</text>
    </g>
  </g>
  <text x="900" y="920" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" fill="#4b515b" letter-spacing="2">Built for the everyday run — not just the longest one.</text>
</svg>
